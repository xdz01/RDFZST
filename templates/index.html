{% extends "base.html" %}

{% block title %}RDFZ食堂大众点评 - 首页{% endblock %}

{% block styles %}
<style>
    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
    }
    
    /* 主页内容区域样式 */
    main {
        min-height: 100vh; /* 确保main至少有一个屏幕高度 */
        display: flex;
        flex-direction: column;
    }
    
    /* 英雄区样式 */
    .hero {
        position: relative;
        width: 100%;
        height: 100vh; /* 使用视口高度，确保填满整个屏幕 */
        min-height: 500px; /* 设置最小高度确保在小屏幕上也有足够空间 */
        overflow: hidden;
        background-image: url("{{ url_for('static', filename='images/appearance.jpg') }}");
        background-size: cover;
        background-position: center;
    }
    
    .hero-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.3);
    }
    
    .hero-content {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 10;
        text-align: center;
        width: 90%;
        max-width: 800px;
    }
    
    .hero-title {
        color: white;
        font-size: 3.5rem;
        font-weight: bold;
        margin-bottom: 1.5rem;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }
    
    .hero-subtitle {
        color: white;
        font-size: 1.5rem;
        margin-bottom: 2rem;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
    }
    
    .start-btn {
        display: inline-block;
        padding: 1rem 3rem;
        background-color: #e74c3c;
        color: white;
        font-size: 1.2rem;
        font-weight: bold;
        border-radius: 50px;
        text-decoration: none;
        transition: background-color 0.3s;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    
    .start-btn:hover {
        background-color: #c0392b;
    }
    
    /* 响应式设计 */
    @media (max-width: 768px) {
        .hero-title {
            font-size: 2.5rem;
        }
        
        .hero-subtitle {
            font-size: 1.2rem;
        }
        
        .start-btn {
            padding: 0.8rem 2rem;
            font-size: 1rem;
        }
    }
    
    @media (max-width: 480px) {
        .hero-title {
            font-size: 2rem;
        }
        
        .hero-subtitle {
            font-size: 1rem;
        }
    }

    /* 向下滚动提示 */
    .scroll-down {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        text-align: center;
        animation: bounce 2s infinite;
        cursor: pointer;
        z-index: 10;
    }

    .scroll-down i {
        font-size: 2rem;
        text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }

    @keyframes bounce {
        0%, 20%, 50%, 80%, 100% {
            transform: translateY(0) translateX(-50%);
        }
        40% {
            transform: translateY(-30px) translateX(-50%);
        }
        60% {
            transform: translateY(-15px) translateX(-50%);
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
        <h1 class="hero-title">RDFZ食堂大众点评</h1>
        <p class="hero-subtitle">探索校园美食，分享你的用餐体验</p>
        <a href="{{ url_for('start') }}" class="start-btn">开始探索</a>
    </div>
    <div class="scroll-down">
        <i class="fas fa-chevron-down"></i>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // 当点击向下滚动按钮时，滚动到页脚位置
    document.querySelector('.scroll-down').addEventListener('click', function() {
        const footer = document.querySelector('footer');
        if (footer) {
            footer.scrollIntoView({ behavior: 'smooth' });
        }
    });

    // 计算并设置hero高度，确保它正好占据视口高度减去页眉高度
    function adjustHeroHeight() {
        const header = document.querySelector('header');
        const headerHeight = header ? header.offsetHeight : 0;
        const windowHeight = window.innerHeight;
        const hero = document.querySelector('.hero');
        
        if (hero) {
            hero.style.height = (windowHeight - headerHeight) + 'px';
        }
    }

    // 页面加载和窗口大小改变时调整高度
    window.addEventListener('load', adjustHeroHeight);
    window.addEventListener('resize', adjustHeroHeight);
</script>
{% endblock %}
