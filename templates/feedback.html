{% extends "base.html" %}

{% block title %}RDFZ食堂大众点评 - 反馈意见{% endblock %}

{% block content %}
<div class="container" style="padding: 2rem; max-width: 800px; margin: 0 auto;">
    <h1 style="text-align: center; margin-bottom: 2rem; color: #2c3e50;">反馈意见</h1>
    <div style="background-color: white; padding: 2rem; border-radius: 10px; box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);">
        <form action="{{ url_for('feedback') }}" method="post" style="display: flex; flex-direction: column; gap: 1.5rem;">
            <div>
                <label for="name" style="display: block; margin-bottom: 0.5rem; color: #2c3e50;">姓名（选填）</label>
                <input type="text" id="name" name="name" style="width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 5px; font-size: 1rem;">
            </div>
            <div>
                <label for="email" style="display: block; margin-bottom: 0.5rem; color: #2c3e50;">邮箱（选填 用于回复）</label>
                <input type="email" id="email" name="email" style="width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 5px; font-size: 1rem;">
            </div>
            <div>
                <label for="message" style="display: block; margin-bottom: 0.5rem; color: #2c3e50;">反馈内容 *</label>
                <textarea id="message" name="message" rows="5" required style="width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 5px; font-size: 1rem; resize: vertical;"></textarea>
            </div>
            <button type="submit" style="padding: 0.8rem; background-color: #3498db; color: white; border: none; border-radius: 5px; font-size: 1rem; cursor: pointer; transition: background-color 0.3s;">提交反馈</button>
        </form>
    </div>
</div>
{% endblock %}
