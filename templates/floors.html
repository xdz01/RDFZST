{% extends "base.html" %}

{% block title %}RDFZ食堂大众点评 - 楼层选择{% endblock %}

{% block styles %}
<style>
    .floors-container {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        gap: 2rem;
        padding: 3rem;
    }
    
    .convenience-store-section {
        display: flex;
        justify-content: center;
        width: 100%;
        margin-top: 2rem;
        padding-top: 2rem;
        border-top: 2px dashed #ddd;
    }
    
    .floor-card {
        width: 280px;
        height: 280px;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        position: relative;
        cursor: pointer;
        transition: transform 0.3s, box-shadow 0.3s;
    }
    
    .floor-card:hover {
        transform: translateY(-10px);
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
    }
    
    .floor-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    
    .floor-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.7));
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        font-weight: bold;
    }
    
    .floor-number {
        font-size: 5rem;
        margin-bottom: 0.5rem;
        text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
    }
    
    .floor-name {
        font-size: 1.5rem;
        text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.5);
    }
    
    .zoom-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: white;
        z-index: 1000;
        display: none;
        justify-content: center;
        align-items: center;
    }
    
    .zoom-content {
        font-size: 3rem;
        color: #2c3e50;
        font-weight: bold;
    }
    
    /* 响应式设计 */
    @media (max-width: 768px) {
        .floors-container {
            flex-direction: column;
            gap: 1.5rem;
            padding: 2rem 1rem;
        }
        
        .convenience-store-section {
            margin-top: 1rem;
            padding-top: 1rem;
        }
        
        .floor-card {
            width: 250px;
            height: 250px;
        }
        
        .floor-number {
            font-size: 4rem !important;
        }
        
        .floor-name {
            font-size: 1.2rem !important;
        }
    }
    
    @media (max-width: 480px) {
        .floor-card {
            width: 220px;
            height: 220px;
        }
        
        .floor-number {
            font-size: 3.5rem !important;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="zoom-overlay" id="zoomOverlay">
    <div class="zoom-content">加载中...</div>
</div>

<div class="container" style="padding: 2rem; max-width: 1200px; margin: 0 auto;">
    <h1 style="text-align: center; margin-bottom: 3rem; color: #2c3e50;">请选择食堂楼层</h1>
    
    <div class="floors-container">
        <div class="floor-card" data-floor="1">
            <img src="{{ url_for('static', filename='images/1.png') }}" alt="一层" class="floor-image">
            <div class="floor-overlay">
                <div class="floor-number">1</div>
                <div class="floor-name">一层食堂</div>
            </div>
        </div>
        
        <div class="floor-card" data-floor="2">
            <img src="{{ url_for('static', filename='images/2.png') }}" alt="二层" class="floor-image">
            <div class="floor-overlay">
                <div class="floor-number">2</div>
                <div class="floor-name">二层食堂</div>
            </div>
        </div>
        
        <div class="floor-card" data-floor="3">
            <img src="{{ url_for('static', filename='images/3.png') }}" alt="三层" class="floor-image">
            <div class="floor-overlay">
                <div class="floor-number">3</div>
                <div class="floor-name">三层食堂</div>
            </div>
        </div>
        
        <!-- 小卖部单独一行 -->
        <div class="convenience-store-section">
            <div class="floor-card" data-floor="4" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                <div class="floor-overlay" style="background: linear-gradient(to bottom, rgba(102,126,234,0.3), rgba(118,75,162,0.7));">
                    <div class="floor-number" style="font-size: 3rem;">🛒</div>
                    <div class="floor-name" style="font-size: 1.3rem;">小卖部</div>
                    <div style="font-size: 0.9rem; margin-top: 0.5rem; opacity: 0.9;">零食 · 饮料 · 日用品</div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const floorCards = document.querySelectorAll('.floor-card');
        const zoomOverlay = document.getElementById('zoomOverlay');
        
        // 确保页面加载时隐藏遮罩
        zoomOverlay.style.display = 'none';
        
        // 处理从其他页面返回的情况
        window.addEventListener('pageshow', function(event) {
            // 如果是从缓存加载页面（比如通过后退按钮）
            if (event.persisted) {
                zoomOverlay.style.display = 'none';
            }
        });
        
        floorCards.forEach(card => {
            card.addEventListener('click', function() {
                const floorId = this.getAttribute('data-floor');
                
                // 直接跳转，不显示加载效果
                window.location.href = `/floor/${floorId}`;
            });
        });
    });
</script>
{% endblock %}
