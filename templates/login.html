{% extends "base.html" %}

{% block title %}RDFZ食堂大众点评 - 登录{% endblock %}

{% block styles %}
<style>
    .captcha-container {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
    }
    
    .captcha-image {
        border: 1px solid #ddd;
        border-radius: 4px;
        cursor: pointer;
        transition: opacity 0.3s;
    }
    
    .captcha-image:hover {
        opacity: 0.8;
    }
    
    .captcha-input {
        flex: 1;
        padding: 8px 12px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 14px;
    }
    
    .captcha-refresh {
        background: #007bff;
        color: white;
        border: none;
        padding: 8px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
        transition: background 0.3s;
    }
    
    .captcha-refresh:hover {
        background: #0056b3;
    }
    
    .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: 500;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
    <h2>登录</h2>
    <form action="{{ url_for('login') }}" method="post" id="loginForm">
        <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div class="form-group">
            <label for="captcha">验证码</label>
            <div class="captcha-container">
                <img id="captchaImage" class="captcha-image" src="" alt="验证码" onclick="refreshCaptcha()">
                <input type="text" id="captcha" name="captcha" class="captcha-input" placeholder="请输入验证码" required>
                <button type="button" class="captcha-refresh" onclick="refreshCaptcha()">刷新</button>
            </div>
        </div>
        <button type="submit" class="submit-btn">登录</button>
    </form>
    <div class="auth-footer">
        还没有账号？ <a href="{{ url_for('register') }}">注册</a>
    </div>
</div>

<script>
// 页面加载时生成验证码
document.addEventListener('DOMContentLoaded', function() {
    refreshCaptcha();
});

// 刷新验证码
function refreshCaptcha() {
    fetch('/captcha')
        .then(response => response.json())
        .then(data => {
            document.getElementById('captchaImage').src = 'data:image/png;base64,' + data.captcha;
        })
        .catch(error => {
            console.error('获取验证码失败:', error);
        });
}

// 表单提交前验证
document.getElementById('loginForm').addEventListener('submit', function(e) {
    const captcha = document.getElementById('captcha').value.trim();
    if (!captcha) {
        e.preventDefault();
        alert('请输入验证码');
        return false;
    }
});
</script>
{% endblock %}
